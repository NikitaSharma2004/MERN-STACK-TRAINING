<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables -HTML</title>
    <style>
    table {
        width: 90%;
        margin: 30px auto;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        background-color: white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
    }

    th {
        background-color: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 16px;
        border:2px solid black;
    }

    td {
        padding: 13px;
        text-align: center;
        border-bottom: 1px solid #ddd;
        color: #333;
        border: 2px solid black;
    }

    tr:nth-child(even) {
        background-color: #f8f9fa;
    }

    tr:hover {
        background-color: #eaf2f8;
        transition: 0.3s;
    }

    tr:last-child td {
        border-bottom: none;
    }
</style>

</head>

<body>
    <H1>Tables in HTML</H1>
    <TABLE>
        <!-- Head of the table -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <!-- Body the the table -->
        <tbody>
            <tr>
                <td>Nikita</td>
                <td>Python developer</td>
                <td>$80000</td>

            </tr>
            <tr>
                <td>priyanshu</td>
                <td>software engineer</td>
                <td>$1000</td>

            </tr>
            <tr>
                <td>Ayush</td>
                <td>cloud engineer</td>
                <td>$40000</td>

            </tr>
            <tr>
                <td>Divya</td>
                <td>web developer</td>
                <td>$10000</td>

            </tr>
        </tbody>
    </TABLE>
</body>

</html>
